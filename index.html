<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1c1b19;--mut:#6b6862;--line:#e4e1d9;--pri:#1f4d3a;--pri2:#173b2c;--red:#b91c1c;--amb:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px 80px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:500}
button:hover{border-color:#cfcabf}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff}
button.primary:hover{background:var(--pri2)}
button.danger{color:var(--red);border-color:#f1c9c9}
button.small{padding:6px 10px;font-size:13px}
button.link{border:0;background:none;color:var(--pri);padding:0;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc3b0;border-color:transparent}
.hidden{display:none!important}
.topo{background:#fff;border-bottom:1px solid var(--line)}
.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:12px}
.marca{font-weight:700;font-size:18px;letter-spacing:-.01em}
.marca small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.quem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);flex-wrap:wrap;justify-content:flex-end}
.abas{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;margin-bottom:6px}
.abas button{white-space:nowrap;border-radius:99px;padding:7px 14px}
.abas button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.barra{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.barra input{flex:1;min-width:180px}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .n{font-size:20px;font-weight:700}
.kpi .l{font-size:12px;color:var(--mut)}
.lista{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.card.click{cursor:pointer}.card.click:hover{border-color:#cfcabf}
.card .t{font-weight:600}
.meta{color:var(--mut);font-size:13px;margin-top:3px}
.meta b{color:var(--ink);font-weight:600}
.dir{text-align:right;white-space:nowrap}
.dir .n{font-weight:700;font-size:16px}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.b-rota{color:#1d4ed8;background:#dbeafe}.b-rec{color:#15803d;background:#dcfce7}.b-can{color:#6b6862;background:#eceae4}
.b-pap{color:#7c3aed;background:#ede9fe}
.warn{color:var(--amb);font-weight:600;font-size:13px;margin-top:4px}
.ok{color:#15803d;font-weight:600;font-size:13px;margin-top:4px}
.vazio{text-align:center;color:var(--mut);padding:36px 10px;border:1px dashed var(--line);border-radius:12px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border-radius:99px;padding:6px 12px;font-size:13px}
.chips button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ov{position:fixed;inset:0;background:rgba(20,20,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:10}
.modal{background:#fff;border-radius:14px;width:100%;max-width:620px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.campo{margin-bottom:12px}
.campo label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:560px){.tres{grid-template-columns:1fr 1fr}}
.rodape{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.tab{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.tab .lin{padding:9px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center}
.tab .lin:last-child{border-bottom:0}
.tab .lin input{width:96px;padding:6px 8px;text-align:right}
.rolar{max-height:320px;overflow:auto}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.enc{font-size:13px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.total{background:#f3f1ec;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.erro{color:var(--red);font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1b19;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.login{max-width:380px;margin:9vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.login h1{margin:0 0 4px;font-size:22px}
.login .sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.login button.primary{width:100%;margin-top:4px}
.alt{text-align:center;margin-top:14px;font-size:14px;color:var(--mut)}
.passo{font-size:14px;margin:0 0 8px}
.planilha{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.planilha th,.planilha td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.planilha th{background:#f3f1ec;font-size:12px;color:var(--mut);font-weight:600}
.planilha td.n,.planilha th.n{text-align:right}
.planilha tr.venc td{color:var(--red)}.planilha tr.pago td{color:var(--mut)}
.scroll{overflow-x:auto;margin-bottom:14px}
h3{font-size:15px;margin:16px 0 8px}
/* ===== fotos dos produtos ===== */
.pinfo{display:flex;gap:12px;align-items:center;min-width:0}
.foto{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:#fff1e0;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:#e2a35c;overflow:hidden}
.foto.p{width:40px;height:40px;font-size:17px;border-radius:8px}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.fotog{width:100%;max-height:360px;border-radius:12px;object-fit:contain;background:#fff8f1;border:1px solid var(--line);display:block}
.fotovazia{width:100%;height:190px;border-radius:12px;border:2px dashed #f3c999;background:#fffdf9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);gap:6px;font-size:14px}
.fotovazia .ic{font-size:40px}
.ph{filter:grayscale(1);opacity:.7}
.semfoto{color:var(--amb);font-size:12px;font-weight:600}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
@media (max-width:560px){.foto{width:48px;height:48px}}
/* ===== tema Iron Import — preto e branco ===== */
:root{--bg:#f4f4f4;--line:#dedede;--pri:#111;--pri2:#000;--ink:#111;--mut:#666;--red:#111;--amb:#111;--steel:#2a2a2a}
body{background:#f4f4f4}
.topo{background:#000;border-bottom:1px solid #000;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.topo .quem{color:#cfcfcf}.topo .quem button{background:#1c1c1c;border-color:#3a3a3a;color:#fff}.topo .quem button:hover{border-color:#fff}
.marca{display:flex;align-items:center;gap:12px;color:#fff}
.logo{font-weight:900;letter-spacing:.04em;line-height:1;display:inline-flex;flex-direction:column}
.logo{align-items:center}.logo img{height:34px;width:auto;display:block}.logo .b{font-size:9px;letter-spacing:.5em;color:#fff;margin-top:4px;padding-left:.5em}
.marca small{color:#9a9a9a;font-weight:500;font-size:12px;letter-spacing:0}
.sep{width:1px;height:34px;background:#3a3a3a}
.abas button{background:#fff;border-color:var(--line);font-weight:600}
.abas button:hover{border-color:#000}
.abas button.on{background:#000;border-color:#000;color:#fff}
button:hover{border-color:#000}
button.primary{background:#000;border-color:#000;color:#fff;font-weight:600}
button.primary:hover{background:#333;border-color:#333}
button.danger{color:#000;border-color:#000;background:#fff}
button.link{color:#000;text-decoration:underline}
input:focus,select:focus,textarea:focus{outline:2px solid #000;border-color:transparent}
.kpi{border-left:4px solid #000}
.card.click:hover{border-color:#000;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.badge{border:1px solid #000}
.b-pap{color:#000;background:#fff;border-color:#fff}
.b-rota{color:#000;background:#fff}.b-alf{color:#000;background:#e4e4e4}.b-rec{color:#fff;background:#000}.b-can{color:#777;background:#f1f1f1;border-color:#bbb}
.warn{color:#000}.ok{color:#000}.erro{color:#000;font-weight:600}
.total{background:#f1f1f1;border:1px solid var(--line)}
.planilha th{background:#f1f1f1;color:#444}
.planilha tr.venc td{color:#000;font-weight:600}
.modal{border-top:5px solid #000}
.login{border-top:6px solid #000;text-align:left;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.login .logobox{background:#000;color:#fff;border-radius:12px;padding:16px;text-align:center;margin-bottom:14px}
.login .logobox{padding:22px 16px}.login .logobox .logo img{height:58px}.login .logobox .logo .b{font-size:11px}
.login h1{text-align:center;font-size:18px}.login .sub{text-align:center}
.foto{background:#f1f1f1;color:#999}
.fotovazia{border-color:#cfcfcf;background:#fafafa}
.fotog{background:#fafafa}
.semfoto{color:#777}
.toast{background:#000;border-left:4px solid #fff}
.passos{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.passos span{font-size:11px;padding:2px 7px;border-radius:99px;background:#eee;color:#888;font-weight:600}
.passos span.f{background:#fff;color:#000;border:1px solid #000}.passos span.a{background:#000;color:#fff}
.rateio td,.rateio th{font-size:13px}
.rateio input{width:90px;padding:6px 8px;text-align:right}
.rateio tr.tot td{font-weight:700;background:#f7f7f7}
@media (max-width:560px){.logo img{height:26px}.marca small{display:none}.sep{display:none}}
</style>

async function reduzirImagem(file,max=1200){
  if(!/^image\//.test(file.type))throw new Error('Escolha um arquivo de imagem (foto).');
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>er(new Error('Não foi possível abrir esta imagem. Tente tirar a foto de novo.'));i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));}
  finally{URL.revokeObjectURL(url);}
}
async function enviarFoto(pid,file){
  const blob=await reduzirImagem(file);const caminho='p'+pid+'/'+Date.now()+'.jpg';
  const {error}=await sb.storage.from('produtos').upload(caminho,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'31536000'});
  if(error)throw error;
  const url=sb.storage.from('produtos').getPublicUrl(caminho).data.publicUrl;
  const antigo=(D.produtos.find(p=>p.id===pid)||{}).foto_url;
  await rpc('definir_foto',{p_produto:pid,p_url:url});apagarFotoAntiga(antigo);
  const p=D.produtos.find(p=>p.id===pid);if(p)p.foto_url=url;return url;
}

function msgErro(e){const m=(e&&(e.message||e.error_description))||'Erro inesperado.';
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use "Entrar".';
  if(/Password should be/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/row-level security|Unauthorized|not allowed|permission denied/i.test(m))return 'Seu acesso não permite esta ação.';
  if(/exceeded the maximum allowed size|Payload too large/i.test(m))return 'A foto é grande demais. Tente outra.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão com a internet. Tente de novo.';
  return m;}

function abrir(html){$('modal').innerHTML=html;$('ov').classList.remove('hidden');const f=$('modal').querySelector('input:not([type=hidden]):not([type=file]),select,textarea');if(f&&window.innerWidth>700)setTimeout(()=>f.focus(),30);}

async function rodar(btn,fn){const err=$('modal').querySelector('.erro');if(err)err.textContent='';btn.disabled=true;
  try{await fn();}catch(e){console.error(e);if(err)err.textContent=msgErro(e);else toast(msgErro(e));btn.disabled=false;}}

  $('cx').onclick=voltar||fechar;$('ok').onclick=()=>rodar($('ok'),async()=>{await fn();});
}

// ---------- autenticação ----------
function telaLogin(msg){
  const cad=modoLogin==='criar',rec=modoLogin==='esqueci';
  $('app').innerHTML=`<div class="login"><div class="logobox">${logoHtml()}</div><h1>Controle de estoque</h1>
  <div class="sub">${cad?'Crie sua conta de acesso.':rec?'Vamos enviar um link para criar uma nova senha.':'Entre com seu e-mail e senha.'}</div>
  <form id="fl">
    ${cad?'<div class="campo"><label>Seu nome</label><input id="l_nome" autocomplete="name" required></div>':''}
    <div class="campo"><label>E-mail</label><input id="l_email" type="email" autocomplete="email" required></div>
    ${rec?'':`<div class="campo"><label>Senha</label><input id="l_senha" type="password" autocomplete="${cad?'new-password':'current-password'}" required minlength="6"></div>`}
    <div class="erro" id="l_erro">${esc(msg||'')}</div>
    <button class="primary" id="l_ok">${cad?'Criar conta':rec?'Enviar link':'Entrar'}</button>
  </form>
  <div class="alt">${cad||rec?'<button class="link" data-m="entrar">Voltar para entrar</button>':'<button class="link" data-m="criar">Criar conta</button> · <button class="link" data-m="esqueci">Esqueci a senha</button>'}</div></div>`;
  $('app').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{modoLogin=b.dataset.m;telaLogin();});
  $('fl').onsubmit=async e=>{e.preventDefault();const b=$('l_ok');b.disabled=true;$('l_erro').textContent='';const email=val('l_email');
    try{
      if(cad){const {data,error}=await sb.auth.signUp({email,password:$('l_senha').value,options:{data:{nome:val('l_nome')},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(!data.session){modoLogin='entrar';telaLogin();$('l_erro').style.color='#000';$('l_erro').textContent='Conta criada! Agora entre com seu e-mail e senha.';return;}}
      else if(rec){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
        $('l_erro').style.color='#000';$('l_erro').textContent='Pronto! Veja seu e-mail e clique no link.';b.disabled=false;return;}
      else{const {error}=await sb.auth.signInWithPassword({email,password:$('l_senha').value});if(error)throw error;}
    }catch(err){$('l_erro').style.color='';$('l_erro').textContent=msgErro(err);b.disabled=false;}
  };
}
function telaPendente(){
  $('app').innerHTML=`<div class="login"><div class="logobox">${logoHtml()}</div><div class="sub">Olá, ${esc(perfil?.nome||sessao.user.email)}.</div>
  <p class="passo">Sua conta foi criada e está aguardando liberação do administrador.</p>
  <p class="passo" style="color:var(--mut)">Assim que o acesso for liberado, toque em "Verificar de novo".</p>
  <button class="primary" id="pv" style="width:100%">Verificar de novo</button>
  <div class="alt"><button class="link" id="ps">Sair</button></div></div>`;
  $('pv').onclick=()=>carregarPerfil();$('ps').onclick=()=>sb.auth.signOut();
}
function modalNovaSenha(){
  abrir(`<h2>Criar nova senha</h2><div class="sub">Digite a nova senha da sua conta.</div>
  <div class="campo"><label>Nova senha</label><input id="ns" type="password" minlength="6" autocomplete="new-password"></div>
  <div class="erro"></div><div class="rodape"><button class="primary" id="ok">Salvar senha</button></div>`);
  $('ok').onclick=()=>rodar($('ok'),async()=>{const {error}=await sb.auth.updateUser({password:$('ns').value});if(error)throw error;fechar();toast('Senha alterada.');});
}
sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='PASSWORD_RECOVERY'){sessao=s;setTimeout(modalNovaSenha,300);}
  if(ev==='SIGNED_IN'&&(!sessao||sessao.user.id!==s.user.id)){sessao=s;setTimeout(carregarPerfil,0);}
  if(ev==='SIGNED_OUT'){sessao=null;perfil=null;aba=null;modoLogin='entrar';setTimeout(()=>telaLogin(),0);}
  if(s)sessao=s;
});
async function iniciar(){const {data:{session}}=await sb.auth.getSession();sessao=session;if(!sessao)return telaLogin();await carregarPerfil();}
async function carregarPerfil(){
  const {data,error}=await sb.from('perfis').select('*').eq('user_id',sessao.user.id).maybeSingle();
  if(error){$('app').innerHTML=`<div class="login"><div class="logobox">${logoHtml()}</div><p class="erro">Não foi possível carregar seu acesso. Tente recarregar a página.</p></div>`;return;}
  perfil=data;if(!perfil||!perfil.papel)return telaPendente();
  if(!aba)aba=perfil.papel==='brasil'?'envios':'produtos';
  if(!window._logou){window._logou=1;log('entrou','Entrou no sistema');}
  await carregar();
}

// ---------- dados ----------
async function carregar(){
  if(carregando)return;carregando=true;
  try{
    const sel='*, envios_custo(frete,imposto,frete_unit,cotacao,custos_lancados), envio_itens(id,produto_id,qtd_enviada,qtd_recebida, envio_itens_custo(custo_medio_saida,custo_usd_saida,frete_unit,imposto_unit,custo_br,do_estoque_eua), encaminhamentos(id,qtd,destino,conta,envio,data,obs,criado_por,criado_em))';
    const reqs=[sb.from('produtos').select('id,nome,sku,foto_url,produtos_custo(qtd_eua,custo_medio,custo_medio_usd)').order('nome'),
      sb.from('envios').select(sel).order('id',{ascending:false}).limit(400),
      sb.from('perfis').select('*').order('nome')];
    if(verCusto())reqs.push(sb.from('compras').select('*').order('id',{ascending:false}).limit(2000));
    const r=await Promise.all(reqs);const e=r.find(x=>x.error);if(e)throw e.error;

  }catch(e){console.error(e);toast('Não foi possível atualizar os dados.');}
  carregando=false;render();
}

function cardEnvio(r){

const C128=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function codigoEtiqueta(p){const t=String(p.sku||'').normalize('NFD').replace(/[^\x20-\x7e]/g,'').trim();return t||('P'+p.id);}
function barras(txt){
  const v=[...txt].map(c=>c.charCodeAt(0)-32);let ck=104;v.forEach((x,i)=>ck+=x*(i+1));
  const cod=[104,...v,ck%103,106].map(i=>C128[i]).join('');
  let x=10,r='';[...cod].forEach((w,i)=>{w=+w;if(i%2===0)r+=`<rect x="${x}" y="0" width="${w}" height="40"/>`;x+=w;});
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} 40" preserveAspectRatio="none">${r}</svg>`;
}
const FORMATOS={
  t5030:{nome:'Térmica 50 × 30 mm (1 por etiqueta)',w:50,h:30,a4:false},
  t6040:{nome:'Térmica 60 × 40 mm (1 por etiqueta)',w:60,h:40,a4:false},
  t4025:{nome:'Térmica 40 × 25 mm (1 por etiqueta)',w:40,h:25,a4:false},
  a4:{nome:'Folha A4 com 30 etiquetas (63,5 × 25,4 mm)',w:63.5,h:25.4,a4:true}};
function imprimirEtiquetas(lista,fmtK,rem){
  const f=FORMATOS[fmtK]||FORMATOS.t5030;const dt=rem?fd(rem.data_saida):'';
  const um_=it=>`<div class="et"><div class="nm">${esc(it.p.nome)}</div><div class="bc">${barras(codigoEtiqueta(it.p))}</div><div class="cd">${esc(codigoEtiqueta(it.p))}</div>${rem?`<div class="rm">Envio #${rem.id} · ${dt}</div>`:''}</div>`;
  const todas=[];lista.forEach(it=>{for(let i=0;i<it.n;i++)todas.push(um_(it));});
  const fs=Math.max(6.5,f.h*0.27);
  const css=`*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;color:#000}
  .et{width:${f.w}mm;height:${f.h}mm;padding:1.4mm 2mm;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .nm{font-size:${fs}pt;font-weight:700;line-height:1.1;max-height:2.25em;overflow:hidden;text-transform:uppercase}
  .bc{flex:1;min-height:0;margin:.8mm 0}.bc svg{width:100%;height:100%;display:block}
  .cd{font-size:${fs*1.05}pt;font-weight:700;text-align:center;letter-spacing:.3px;line-height:1}
  .rm{font-size:${Math.max(5.5,fs*.75)}pt;text-align:center;line-height:1.1;margin-top:.4mm}`+
  (f.a4?`@page{size:A4;margin:12.9mm 7.2mm}.folha{display:grid;grid-template-columns:repeat(3,${f.w}mm);grid-auto-rows:${f.h}mm;column-gap:2.5mm}`
       :`@page{size:${f.w}mm ${f.h}mm;margin:0}.et{page-break-after:always;break-after:page}.et:last-child{page-break-after:auto;break-after:auto}`);
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Etiquetas</title><style>${css}</style></head><body>${f.a4?`<div class="folha">${todas.join('')}</div>`:todas.join('')}</body></html>`;
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(fr);
  const d=fr.contentWindow.document;d.open();d.write(html);d.close();
  setTimeout(()=>{fr.contentWindow.focus();fr.contentWindow.print();setTimeout(()=>fr.remove(),60000);},400);
  log('acao','Imprimiu '+todas.length+' etiqueta(s)'+(rem?' da envio #'+rem.id:''));
}

  ${it.map(i=>`<tr><td>${esc(produto(i.produto_id).nome)}</td><td class="n" data-kq="${i.id}"></td><td class="n"><input data-ku="${i.id}" inputmode="decimal" placeholder="0,00" value="${i.custo&&+i.custo.custo_usd_saida?br(i.custo.custo_usd_saida):''}"></td>
    <td class="n" data-kb="${i.id}"></td><td class="n" data-kf="${i.id}"></td><td class="n" data-ki="${i.id}"></td><td class="n" data-kc="${i.id}"></td><td class="n" data-kt="${i.id}"></td></tr>`).join('')}
  <tr class="tot"><td>Total</td><td class="n" id="k_tq"></td><td></td><td class="n" id="k_tb"></td><td class="n" id="k_tf"></td><td class="n" id="k_ti"></td><td></td><td class="n" id="k_tt"></td></tr></table></div>
  <div class="meta">O frete é dividido por unidade que chegou. O imposto é dividido pelo valor de cada produto: o mais caro carrega mais imposto.</div>`;
}
function ligarCustos(r,qtdFn){
  const it=itensEnv(r),M=$('modal'),q_=s=>M.querySelector(s);
  const calc=()=>{if(!$('k_cot'))return null;const k=dinheiro(val('k_cot')),fr=dinheiro(val('k_fr'))||0,im=dinheiro(val('k_im'))||0;
    const L=it.map(i=>{const u=dinheiro(q_(`[data-ku="${i.id}"]`).value);return {id:i.id,q:qtdFn(i),u,b:isNaN(u)||isNaN(k)?NaN:u*k};});
    const tq=L.reduce((s,x)=>s+x.q,0),tv=L.reduce((s,x)=>s+(isNaN(x.b)?0:x.q*x.b),0),fu=tq?fr/tq:0;let tb=0,tf=0,ti=0,tt=0;
    L.forEach(x=>{const iu=isNaN(x.b)?NaN:(tv>0?im*x.b/tv:(tq?im/tq:0)),fin=x.b+fu+iu;
      q_(`[data-kq="${x.id}"]`).textContent=un(x.q);q_(`[data-kb="${x.id}"]`).textContent=isNaN(x.b)?'—':brl(x.b);
      q_(`[data-kf="${x.id}"]`).textContent=brl(fu);q_(`[data-ki="${x.id}"]`).textContent=isNaN(iu)?'—':brl(iu);
      q_(`[data-kc="${x.id}"]`).innerHTML=isNaN(fin)?'—':'<b>'+brl(fin)+'</b>';q_(`[data-kt="${x.id}"]`).textContent=isNaN(fin)?'—':brl(fin*x.q);
      if(!isNaN(fin)){tb+=x.b*x.q;tf+=fu*x.q;ti+=iu*x.q;tt+=fin*x.q;}});
    $('k_tq').textContent=un(tq);$('k_tb').textContent=brl(tb);$('k_tf').textContent=brl(tf);$('k_ti').textContent=brl(ti);$('k_tt').innerHTML='<b>'+brl(tt)+'</b>';
    return {k,fr,im,L};};
  $('kwrap').addEventListener('input',calc);calc();
  return opcional=>{const {k,fr,im,L}=calc();
    if(opcional&&L.every(x=>isNaN(x.u))&&!val('k_fr')&&!val('k_im'))return null;
    if(isNaN(k)||k<=0)throw new Error('Informe a cotação do dólar.');
    if(L.some(x=>isNaN(x.u)))throw new Error('Informe o custo unitário (US$) de todos os produtos.');
    if(isNaN(dinheiro(val('k_fr')||'0'))||isNaN(dinheiro(val('k_im')||'0')))throw new Error('Valor de frete ou imposto inválido.');
    gravarPref('iron_cotacao',val('k_cot'));
    return {p_envio:r.id,p_cotacao:k,p_frete:fr,p_imposto:im,p_itens:L.map(x=>({item_id:x.id,custo_usd:x.u}))};};
}
function modalCustos(rid){
  const r=D.envios.find(x=>x.id===rid);if(!r)return;
  abrir(`<h2>Preço de custo — Envio #${r.id}</h2><div class="sub">Lance o custo unitário de cada produto, o frete e o imposto. O sistema divide e calcula o custo final de cada produto.</div>
  <div id="kwrap">${blocoCustos(r)}</div><div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Salvar preço de custo</button></div>`);
  const pegar=ligarCustos(r,i=>r.status==='recebido'?(i.qtd_recebida??i.qtd_enviada):i.qtd_enviada);
  $('cx').onclick=()=>modalDetalhe(rid);
  $('ok').onclick=()=>rodar($('ok'),async()=>{const a=pegar(false);await rpc('lancar_custos_entrada',a);toast('Preço de custo lançado.');await carregar();modalDetalhe(rid);});
}

function modalDetalhe(id){log('abriu','Envio #'+id);
  const r=D.envios.find(x=>x.id===id);if(!r)return;
  const it=itensEnv(r),c=um(r.envios_custo);
  const linhas=it.map(i=>{const p=produto(i.produto_id);
    const custo=i.custo&&verCusto()?(+i.custo.custo_medio_saida<=0?`<div class="meta">Preço de custo a lançar</div>`:`<div class="meta">Custo ${brl(i.custo.custo_medio_saida,4)} (${usd(i.custo.custo_usd_saida,4)}) + frete ${brl(i.custo.frete_unit,4)} + imposto ${brl(i.custo.imposto_unit,4)} = <b>custo final ${brl(i.custo.custo_br,2)}</b> por unidade</div>`):'';
    const encs=(i.encaminhamentos||[]).slice().sort((a,b)=>a.id-b.id).map(e=>`<div class="enc"><span>→ <b>${un(e.qtd)}</b> un. ${esc(e.destino)}${e.conta?' ('+esc(e.conta)+')':''}${e.envio?' · envio '+esc(e.envio):''} · ${fd(e.data)}${nomeDe(e.criado_por)?' · '+esc(nomeDe(e.criado_por)):''}${e.obs?' · '+esc(e.obs):''}</span>${podeBR()?`<button class="small" data-desf="${e.id}">Desfazer</button>`:''}</div>`).join('');
    return `<div class="item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="pinfo" style="align-items:flex-start"><span data-zoom="${esc(p.foto_url||'')}" style="cursor:${p.foto_url?'zoom-in':'default'}">${foto(p,1)}</span><div><b>${esc(p.nome)}</b>${p.sku?' <span class="meta">'+esc(p.sku)+'</span>':''}
      <div class="meta">Enviado <b>${un(i.qtd_enviada)}</b>${r.status==='recebido'?` · Recebido <b>${un(i.qtd_recebida)}</b> · Encaminhado ${un(i.enc)} · <b>No depósito ${un(i.disp)}</b>`:''}</div>
      ${r.status==='recebido'&&i.qtd_recebida!==i.qtd_enviada?`<div class="warn">⚠ Divergência: ${un(i.qtd_enviada-i.qtd_recebida)} un.</div>`:''}${custo}</div></div>
      ${r.status==='recebido'&&i.disp>0&&podeBR()?`<button class="small primary" data-encam="${i.id}">Encaminhar</button>`:''}</div>${encs}</div>`;}).join('');
  const env=it.reduce((s,i)=>s+i.qtd_enviada,0);const temEnc=it.some(i=>i.enc>0);
  abrir(`<h2>Envio #${r.id} · ${esc(r.transportadora)} ${badgeEnv(r.status)}</h2>
  <div class="sub">Saída ${fd(r.data_saida)}${r.rastreio?' · Rastreio <b>'+esc(r.rastreio)+'</b>':''}${r.caixas?' · '+un(r.caixas)+' caixa(s)':''}${r.peso_kg?' · '+String(r.peso_kg).replace('.',',')+' kg':''} · ${un(env)} un.${nomeDe(r.criado_por)?' · por '+esc(nomeDe(r.criado_por)):''}
  ${r.data_alfandega?`<br>Alfândega ${fd(r.data_alfandega)}${r.obs_alfandega?' · '+esc(r.obs_alfandega):''}`:''}
  ${r.status==='recebido'?`<br>Chegou no Brasil ${fd(r.data_chegada)}${nomeDe(r.recebido_por)?' · confirmado por '+esc(nomeDe(r.recebido_por)):''}${r.obs_chegada?' · '+esc(r.obs_chegada):''}`:''}
  ${r.obs?'<br>Obs.: '+esc(r.obs):''}</div>${passos(r)}
  ${c&&verCusto()?`<div class="total">${c.custos_lancados||+c.frete||+c.imposto?`Frete <b>${brl(c.frete)}</b> (${brl(c.frete_unit)} por unidade) · Imposto <b>${brl(c.imposto)}</b> (pelo valor de cada produto)${c.cotacao?' · Dólar '+String(+c.cotacao).replace('.',','):''}`:'Preço de custo ainda não lançado.'}
    ${podeCusto()&&r.status!=='cancelado'?` · <button class="link" id="custos">${c.custos_lancados?'Alterar preço de custo':'Lançar preço de custo'}</button>`:''}</div>`:''}
  ${linhas}<div class="erro"></div>
  <div class="rodape">${aCaminho(r.status)&&podeCusto()?`<button class="danger" id="canc">Cancelar / devolvido</button>`:''}
  ${r.status==='recebido'&&ehAdmin()&&!temEnc?`<button id="desch">Desfazer chegada</button>`:''}
  ${r.status!=='cancelado'&&podeCusto()?`<button id="etq">Etiquetas</button>`:''}
  ${r.status==='transito'&&podeAlf()?`<button id="alf">Marcar na alfândega</button>`:''}
  ${aCaminho(r.status)&&podeBR()?`<button class="primary" id="cheg">Dar entrada</button>`:''}
  ${r.status==='recebido'&&podeCusto()&&c&&!c.custos_lancados?`<button class="primary" id="lcust">Lançar preço de custo</button>`:''}<button id="cx">Fechar</button></div>`);
  $('cx').onclick=fechar;
  const volta=()=>modalDetalhe(id);
  if($('cheg'))$('cheg').onclick=()=>modalChegada(r.id);
  if($('etq'))$('etq').onclick=()=>modalEtiquetas(r.id,false);
  if($('lcust'))$('lcust').onclick=()=>modalCustos(r.id);
  if($('custos'))$('custos').onclick=()=>modalCustos(r.id);
  if($('alf'))$('alf').onclick=()=>{abrir(`<h2>Envio #${r.id} na alfândega</h2><div class="sub">Use quando o pacote ficar retido ou em fiscalização.</div>
    <div class="duas"><div class="campo"><label>Data</label><input id="a_data" type="date" value="${hoje()}"></div><div class="campo"><label>Observação</label><input id="a_obs" placeholder="ex.: aguardando pagamento do imposto"></div></div>
    <div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Confirmar</button></div>`);
    $('cx').onclick=volta;$('ok').onclick=()=>rodar($('ok'),async()=>{await rpc('marcar_alfandega',{p_envio:r.id,p_data:val('a_data')||hoje(),p_obs:val('a_obs')});toast('Envio marcado na alfândega.');await carregar();volta();});};
  if($('canc'))$('canc').onclick=()=>confirmar('Cancelar o envio #'+r.id+'?','Use se o envio foi cancelado ou devolvido aos EUA. As quantidades voltam para o estoque dos EUA.','Cancelar envio',async()=>{await rpc('cancelar_envio',{p_envio:r.id});toast('Envio cancelado.');await carregar();fechar();},volta);
  if($('desch'))$('desch').onclick=()=>confirmar('Desfazer a chegada do envio #'+r.id+'?','O envio volta a aparecer como a caminho.','Desfazer',async()=>{await rpc('desfazer_chegada',{p_envio:r.id});toast('Chegada desfeita.');await carregar();volta();},volta);
  $('modal').querySelectorAll('[data-encam]').forEach(b=>b.onclick=()=>modalEncaminhar(r.id,+b.dataset.encam));
  $('modal').querySelectorAll('[data-zoom]').forEach(b=>{if(b.dataset.zoom)b.onclick=()=>ampliar(b.dataset.zoom);});
  $('modal').querySelectorAll('[data-desf]').forEach(b=>b.onclick=()=>rodar(b,async()=>{await rpc('desfazer_encaminhamento',{p_id:+b.dataset.desf});toast('Encaminhamento desfeito.');await carregar();volta();}));
}

function modalChegada(rid){
  const r=D.envios.find(x=>x.id===rid),it=itensEnv(r),cus=podeCusto();
  abrir(`<h2>Dar entrada — Envio #${r.id}</h2><div class="sub">Confira quanto chegou de cada produto${cus?' e lance o preço de custo. O sistema divide o frete e o imposto e calcula o custo final de cada produto':''}.</div>
  <div id="kwrap"><div class="tab">${it.map(i=>`<div class="lin"><div class="pinfo">${foto(produto(i.produto_id),1)}<div>${esc(produto(i.produto_id).nome)}<div class="meta">Enviado ${un(i.qtd_enviada)} · quantidade que chegou:</div></div></div>
    <input data-rec="${i.id}" inputmode="numeric" value="${i.qtd_enviada}"></div>`).join('')}</div>
  <div class="duas"><div class="campo"><label>Data de chegada</label><input id="c_data" type="date" value="${hoje()}"></div>
  <div class="campo"><label>Observação (avarias, faltas…)</label><input id="c_obs"></div></div>
  ${cus?blocoCustos(r)+'<div class="meta">Se ainda não tiver os valores, deixe em branco e lance depois no envio.</div>':''}</div>
  <div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Dar entrada</button></div>`);
  const pegar=cus?ligarCustos(r,i=>num(($('modal').querySelector(`[data-rec="${i.id}"]`)||{}).value)):null;
  $('cx').onclick=()=>modalDetalhe(rid);
  $('ok').onclick=()=>rodar($('ok'),async()=>{
    const itens=[...$('modal').querySelectorAll('[data-rec]')].map(i=>({item_id:+i.dataset.rec,qtd:num(i.value)}));
    const a=pegar?pegar(true):null;
    await rpc('confirmar_chegada',{p_envio:rid,p_data:val('c_data')||hoje(),p_itens:itens,p_obs:val('c_obs')});
    if(a)await rpc('lancar_custos_entrada',a);
    toast(a?'Entrada feita com preço de custo.':'Entrada feita.');await carregar();modalDetalhe(rid);});
}

function modalEncaminhar(rid,iid){
  const r=D.envios.find(x=>x.id===rid),i=itensEnv(r).find(x=>x.id===iid),p=produto(i.produto_id);
  abrir(`<h2>Encaminhar mercadoria</h2><div class="sub">${esc(p.nome)} — ${un(i.disp)} un. no depósito (envio #${rid}).</div>
  <div class="campo"><label>Para onde foi?</label><select id="n_dest">${DESTINOS.map(d=>`<option>${d}</option>`).join('')}</select></div>
  <div class="campo hidden" id="c_outro"><label>Qual destino?</label><input id="n_outro"></div>
  <div class="duas"><div class="campo"><label>Quantidade</label><input id="n_qtd" inputmode="numeric" value="${i.disp}"></div>
  <div class="campo"><label>Conta / loja</label><input id="n_conta"></div></div>
  <div class="duas"><div class="campo"><label>Nº do envio / agendamento</label><input id="n_envio"></div>
  <div class="campo"><label>Data</label><input id="n_data" type="date" value="${hoje()}"></div></div>
  <div class="campo"><label>Observação</label><input id="n_obs"></div>
  <div class="meta">Se encaminhar só uma parte, o restante continua no depósito.</div>
  <div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Confirmar</button></div>`);
  $('n_dest').onchange=()=>$('c_outro').classList.toggle('hidden',$('n_dest').value!=='Outro');
  $('cx').onclick=()=>modalDetalhe(rid);
  $('ok').onclick=()=>{const dest=$('n_dest').value==='Outro'?val('n_outro'):$('n_dest').value;const q=num(val('n_qtd'));const er=$('modal').querySelector('.erro');
    if(!dest){er.textContent='Informe o destino.';return;}if(!q||q>i.disp){er.textContent='A quantidade deve ser entre 1 e '+i.disp+'.';return;}
    rodar($('ok'),async()=>{await rpc('encaminhar',{p_item:iid,p_qtd:q,p_destino:dest,p_conta:val('n_conta'),p_envio:val('n_envio'),p_data:val('n_data')||hoje(),p_obs:val('n_obs')});
      toast('Encaminhamento registrado.');await carregar();modalDetalhe(rid);});};
}

// ---------- eventos ----------
$('app').addEventListener('click',async e=>{
  const t=e.target.closest('[data-aba],[data-act],[data-fe],[data-env],[data-prod],[data-comp]');if(!t)return;
  if(t.dataset.prod){modalProduto(+t.dataset.prod);return;}
  if(t.dataset.comp){modalCompraDet(+t.dataset.comp);return;}
  if(t.dataset.aba){aba=t.dataset.aba;busca='';log('aba',t.textContent.trim());render();return;}
  if(t.dataset.fe){filtroEnv=t.dataset.fe;render();return;}
  if(t.dataset.env){modalDetalhe(+t.dataset.env);return;}
  const a=t.dataset.act;
  if(a==='sair')sb.auth.signOut();
  if(a==='atualizar'){await carregar();toast('Atualizado.');}
  if(a==='compra')modalCompra();
  if(a==='envio')modalEnvio();
  if(a==='produto')modalNovoProduto();
});
$('app').addEventListener('input',e=>{if(e.target.id==='busca'){busca=e.target.value;render();}});
$('app').addEventListener('change',async e=>{if(e.target.id==='filtroAc'){filtroAc=e.target.value;render();return;}const s=e.target.closest('[data-papel]');if(!s)return;
  try{await rpc('definir_papel',{p_user:s.dataset.papel,p_papel:s.value||null});toast('Acesso atualizado.');await carregar();}
  catch(err){toast(msgErro(err));await carregar();}});

iniciar();
</script>
</body>
</html>
