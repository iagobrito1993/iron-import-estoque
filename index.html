<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<script>if(location.protocol==='http:'&&/ironimportestoque\.com\.br$/.test(location.hostname))location.replace('https://'+location.host+location.pathname+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Iron Import Estoque</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='900' font-size='30' fill='%23fff' text-anchor='middle'%3EII%3C/text%3E%3Crect x='14' y='50' width='36' height='4' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1c1b19;--mut:#6b6862;--line:#e4e1d9;--pri:#1f4d3a;--pri2:#173b2c;--red:#b91c1c;--amb:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px 80px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:500}
button:hover{border-color:#cfcabf}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff}
button.primary:hover{background:var(--pri2)}
button.danger{color:var(--red);border-color:#f1c9c9}
button.small{padding:6px 10px;font-size:13px}
button.link{border:0;background:none;color:var(--pri);padding:0;font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc3b0;border-color:transparent}
.hidden{display:none!important}
.topo{background:#fff;border-bottom:1px solid var(--line)}
.topo .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:12px}
.marca{font-weight:700;font-size:18px;letter-spacing:-.01em}
.marca small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.quem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);flex-wrap:wrap;justify-content:flex-end}
.abas{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;margin-bottom:6px}
.abas button{white-space:nowrap;border-radius:99px;padding:7px 14px}
.abas button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.barra{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.barra input{flex:1;min-width:180px}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .n{font-size:20px;font-weight:700}
.kpi .l{font-size:12px;color:var(--mut)}
.lista{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.card.click{cursor:pointer}.card.click:hover{border-color:#cfcabf}
.card .t{font-weight:600}
.meta{color:var(--mut);font-size:13px;margin-top:3px}
.meta b{color:var(--ink);font-weight:600}
.dir{text-align:right;white-space:nowrap}
.dir .n{font-weight:700;font-size:16px}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.b-rota{color:#1d4ed8;background:#dbeafe}.b-rec{color:#15803d;background:#dcfce7}.b-can{color:#6b6862;background:#eceae4}
.b-pap{color:#7c3aed;background:#ede9fe}
.warn{color:var(--amb);font-weight:600;font-size:13px;margin-top:4px}
.ok{color:#15803d;font-weight:600;font-size:13px;margin-top:4px}
.vazio{text-align:center;color:var(--mut);padding:36px 10px;border:1px dashed var(--line);border-radius:12px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border-radius:99px;padding:6px 12px;font-size:13px}
.chips button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ov{position:fixed;inset:0;background:rgba(20,20,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:10}
.modal{background:#fff;border-radius:14px;width:100%;max-width:620px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.campo{margin-bottom:12px}
.campo label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tres{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:560px){.tres{grid-template-columns:1fr 1fr}}
.rodape{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.tab{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.tab .lin{padding:9px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center}
.tab .lin:last-child{border-bottom:0}
.tab .lin input{width:96px;padding:6px 8px;text-align:right}
.rolar{max-height:320px;overflow:auto}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.enc{font-size:13px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.total{background:#f3f1ec;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.erro{color:var(--red);font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c1b19;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
.login{max-width:380px;margin:9vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.login h1{margin:0 0 4px;font-size:22px}
.login .sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.login button.primary{width:100%;margin-top:4px}
.alt{text-align:center;margin-top:14px;font-size:14px;color:var(--mut)}
.passo{font-size:14px;margin:0 0 8px}
.planilha{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.planilha th,.planilha td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.planilha th{background:#f3f1ec;font-size:12px;color:var(--mut);font-weight:600}
.planilha td.n,.planilha th.n{text-align:right}
.planilha tr.venc td{color:var(--red)}.planilha tr.pago td{color:var(--mut)}
.scroll{overflow-x:auto;margin-bottom:14px}
h3{font-size:15px;margin:16px 0 8px}
/* ===== fotos dos produtos ===== */
.pinfo{display:flex;gap:12px;align-items:center;min-width:0}
.foto{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:#fff1e0;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:#e2a35c;overflow:hidden}
.foto.p{width:40px;height:40px;font-size:17px;border-radius:8px}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.fotog{width:100%;max-height:360px;border-radius:12px;object-fit:contain;background:#fff8f1;border:1px solid var(--line);display:block}
.fotovazia{width:100%;height:190px;border-radius:12px;border:2px dashed #f3c999;background:#fffdf9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);gap:6px;font-size:14px}
.fotovazia .ic{font-size:40px}
.ph{filter:grayscale(1);opacity:.7}
.semfoto{color:var(--amb);font-size:12px;font-weight:600}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
@media (max-width:560px){.foto{width:48px;height:48px}}
/* ===== tema Iron Import — preto e branco ===== */
:root{--bg:#f4f4f4;--line:#dedede;--pri:#111;--pri2:#000;--ink:#111;--mut:#666;--red:#111;--amb:#111;--steel:#2a2a2a}
body{background:#f4f4f4}
.topo{background:#000;border-bottom:1px solid #000;position:sticky;top:0;z-index:5;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.topo .quem{color:#cfcfcf}.topo .quem button{background:#1c1c1c;border-color:#3a3a3a;color:#fff}.topo .quem button:hover{border-color:#fff}
.marca{display:flex;align-items:center;gap:12px;color:#fff}
.logo{font-weight:900;letter-spacing:.04em;line-height:1;display:inline-flex;flex-direction:column}
.logo{align-items:center}.logo img{height:34px;width:auto;display:block}.logo .b{font-size:9px;letter-spacing:.5em;color:#fff;margin-top:4px;padding-left:.5em}
.marca small{color:#9a9a9a;font-weight:500;font-size:12px;letter-spacing:0}
.sep{width:1px;height:34px;background:#3a3a3a}
.abas button{background:#fff;border-color:var(--line);font-weight:600}
.abas button:hover{border-color:#000}
.abas button.on{background:#000;border-color:#000;color:#fff}
button:hover{border-color:#000}
button.primary{background:#000;border-color:#000;color:#fff;font-weight:600}
button.primary:hover{background:#333;border-color:#333}
button.danger{color:#000;border-color:#000;background:#fff}
button.link{color:#000;text-decoration:underline}
input:focus,select:focus,textarea:focus{outline:2px solid #000;border-color:transparent}
.kpi{border-left:4px solid #000}
.card.click:hover{border-color:#000;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.badge{border:1px solid #000}
.b-pap{color:#000;background:#fff;border-color:#fff}
.b-rota{color:#000;background:#fff}.b-alf{color:#000;background:#e4e4e4}.b-rec{color:#fff;background:#000}.b-can{color:#777;background:#f1f1f1;border-color:#bbb}
.warn{color:#000}.ok{color:#000}.erro{color:#000;font-weight:600}
.total{background:#f1f1f1;border:1px solid var(--line)}
.planilha th{background:#f1f1f1;color:#444}
.planilha tr.venc td{color:#000;font-weight:600}
.modal{border-top:5px solid #000}
.login{border-top:6px solid #000;text-align:left;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.login .logobox{background:#000;color:#fff;border-radius:12px;padding:16px;text-align:center;margin-bottom:14px}
.login .logobox{padding:22px 16px}.login .logobox .logo img{height:58px}.login .logobox .logo .b{font-size:11px}
.login h1{text-align:center;font-size:18px}.login .sub{text-align:center}
.foto{background:#f1f1f1;color:#999}
.fotovazia{border-color:#cfcfcf;background:#fafafa}
.fotog{background:#fafafa}
.semfoto{color:#777}
.toast{background:#000;border-left:4px solid #fff}
.passos{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.passos span{font-size:11px;padding:2px 7px;border-radius:99px;background:#eee;color:#888;font-weight:600}
.passos span.f{background:#fff;color:#000;border:1px solid #000}.passos span.a{background:#000;color:#fff}
.rateio td,.rateio th{font-size:13px}
.rateio input{width:90px;padding:6px 8px;text-align:right}
.rateio tr.tot td{font-weight:700;background:#f7f7f7}
@media (max-width:560px){.logo img{height:26px}.marca small{display:none}.sep{display:none}}
.b-prep{color:#000;background:#fff;border-style:dashed}.b-lib{color:#000;background:#d9d9d9}.b-par{color:#fff;background:#555;border-color:#555}.b-ret{color:#fff;background:#000;border-color:#000;box-shadow:inset 0 0 0 2px #fff}
.kpi.click{cursor:pointer}.kpi.click:hover{background:#fafafa}
.prog{height:6px;background:#e6e6e6;border-radius:99px;overflow:hidden;margin-top:6px}.prog span{display:block;height:100%;background:#000}
.scan{border:2px solid #000;border-radius:12px;padding:10px;margin:10px 0;background:#fafafa}.scanlin{display:flex;gap:8px}.scanlin input{font-size:16px;font-weight:600}
.scanmsg{font-size:14px;margin-top:6px;font-weight:600;padding:6px 8px;border-radius:8px}.scanmsg.ok{background:#000;color:#fff}.scanmsg.err{background:#fff;color:#000;border:2px dashed #000}
.scanmsg.pisca{animation:pisca .35s}@keyframes pisca{0%{transform:scale(1.03)}100%{transform:scale(1)}}
input.lido{outline:3px solid #1a7f37;background:#eaf7ee}
#sc_cambox video{width:100%;max-height:260px;border-radius:10px;margin-top:8px;background:#000}
input.excede{outline:2px dashed #000;font-weight:700}
.item.estorn{opacity:.55}
.anx{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:13px}.anxi{background:#f1f1f1;border-radius:8px;padding:4px 8px}.link.mut{color:#777;font-weight:400}
.btnfile{display:inline-block;border:1px solid #000;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600;cursor:pointer;background:#fff}
.perms{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px}.perms label{display:flex;gap:6px;align-items:center}.perms input{width:auto}.perms label.fixo{color:#888}
tr.clk{cursor:pointer}tr.clk:hover td{background:#fafafa}
.planilha tr.tot td{font-weight:700;background:#f7f7f7}
.modal{max-width:860px}
@media (max-width:560px){.modal{padding:14px}.planilha th,.planilha td{padding:6px 7px}}
</style>
</head>

async function reduzirImagem(file,max=1200){
  if(!/^image\//.test(file.type))throw new Error('Escolha um arquivo de imagem (foto).');
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>er(new Error('Não foi possível abrir esta imagem. Tente tirar a foto de novo.'));i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));}
  finally{URL.revokeObjectURL(url);}
}
async function enviarFoto(pid,file){
  const blob=await reduzirImagem(file);const caminho='p'+pid+'/'+Date.now()+'.jpg';
  const {error}=await sb.storage.from('produtos').upload(caminho,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'31536000'});
  if(error)throw error;
  const url=sb.storage.from('produtos').getPublicUrl(caminho).data.publicUrl;
  const antigo=(D.produtos.find(p=>p.id===pid)||{}).foto_url;
  await rpc('definir_foto',{p_produto:pid,p_url:url});apagarFotoAntiga(antigo);
  const p=D.produtos.find(p=>p.id===pid);if(p)p.foto_url=url;return url;
}

  if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use "Entrar".';
  if(/Password should be/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/row-level security|Unauthorized|not allowed|permission denied/i.test(m))return 'Seu acesso não permite esta ação.';
  if(/exceeded the maximum allowed size|Payload too large/i.test(m))return 'A foto é grande demais. Tente outra.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão com a internet. Tente de novo.';
  return m;}

function telaLogin(msg){
  const cad=modoLogin==='criar',rec=modoLogin==='esqueci';
  $('app').innerHTML=`<div class="login"><div class="logobox">${logoHtml()}</div><h1>Controle de estoque</h1>
  <div class="sub">${cad?'Crie sua conta de acesso.':rec?'Vamos enviar um link para criar uma nova senha.':'Entre com seu e-mail e senha.'}</div>
  <form id="fl">
    ${cad?'<div class="campo"><label>Seu nome</label><input id="l_nome" autocomplete="name" required></div>':''}
    <div class="campo"><label>E-mail</label><input id="l_email" type="email" autocomplete="email" required></div>
    ${rec?'':`<div class="campo"><label>Senha</label><input id="l_senha" type="password" autocomplete="${cad?'new-password':'current-password'}" required minlength="6"></div>`}
    <div class="erro" id="l_erro">${esc(msg||'')}</div>
    <button class="primary" id="l_ok">${cad?'Criar conta':rec?'Enviar link':'Entrar'}</button>
  </form>
  <div class="alt">${cad||rec?'<button class="link" data-m="entrar">Voltar para entrar</button>':'<button class="link" data-m="criar">Criar conta</button> · <button class="link" data-m="esqueci">Esqueci a senha</button>'}</div></div>`;
  $('app').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{modoLogin=b.dataset.m;telaLogin();});
  $('fl').onsubmit=async e=>{e.preventDefault();const b=$('l_ok');b.disabled=true;$('l_erro').textContent='';const email=val('l_email');
    try{
      if(cad){const {data,error}=await sb.auth.signUp({email,password:$('l_senha').value,options:{data:{nome:val('l_nome')},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(!data.session){modoLogin='entrar';telaLogin();$('l_erro').style.color='#000';$('l_erro').textContent='Conta criada! Agora entre com seu e-mail e senha.';return;}}
      else if(rec){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
        $('l_erro').style.color='#000';$('l_erro').textContent='Pronto! Veja seu e-mail e clique no link.';b.disabled=false;return;}
      else{const {error}=await sb.auth.signInWithPassword({email,password:$('l_senha').value});if(error)throw error;}
    }catch(err){$('l_erro').style.color='';$('l_erro').textContent=msgErro(err);b.disabled=false;}
  };
}
function telaPendente(){
  $('app').innerHTML=`<div class="login"><div class="logobox">${logoHtml()}</div><div class="sub">Olá, ${esc(perfil?.nome||sessao.user.email)}.</div>

}

sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='PASSWORD_RECOVERY'){sessao=s;setTimeout(modalNovaSenha,300);}
  if(ev==='SIGNED_IN'&&(!sessao||sessao.user.id!==s.user.id)){sessao=s;setTimeout(carregarPerfil,0);}
  if(ev==='SIGNED_OUT'){sessao=null;perfil=null;aba=null;modoLogin='entrar';setTimeout(()=>telaLogin(),0);}
  if(s)sessao=s;
});
async function iniciar(){atualizarCotacao().then(c=>{if(c&&typeof aba!=='undefined'&&aba==='painel'&&document.querySelector('[data-aba]'))render();});setInterval(()=>atualizarCotacao(),30*60*1000);const {data:{session}}=await sb.auth.getSession();sessao=session;if(!sessao)return telaLogin();await carregarPerfil();}
async function carregarPerfil(){
  const {data,error}=await sb.from('perfis').select('*').eq('user_id',sessao.user.id).maybeSingle();
  if(error){$('app').innerHTML=`<div class="login"><div class="logobox">${logoHtml()}</div><p class="erro">Não foi possível carregar seu acesso. Tente recarregar a página.</p></div>`;return;}
  perfil=data;if(!perfil||!perfil.papel)return telaPendente();
  if(!aba)aba='painel';
  if(!window._logou){window._logou=1;log('entrou','Entrou no sistema');}
  await carregar();
}

let audioCtx=null;
function bip(bom){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='square';o.frequency.value=bom?1250:200;g.gain.value=.07;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(bom?.07:.4));}catch(e){}
  if(!bom&&navigator.vibrate)navigator.vibrate(250);}
function normCod(c){return String(c||'').trim().replace(/\s/g,'').replace(/^0+(?=\d)/,'').toUpperCase();}
function acharCodigo(cod){const n=normCod(cod);if(!n)return null;
  for(const p of D.produtos){if(p.codigo_caixa&&normCod(p.codigo_caixa)===n)return {p,mult:p.un_por_caixa||1,caixa:true};}
  for(const p of D.produtos){for(const c of ['ean','upc','sku'])if(p[c]&&normCod(p[c])===n)return {p,mult:1,caixa:false};}
  return null;}
// câmera: usa o leitor nativo do navegador (Android/Chrome) ou a biblioteca ZXing (iPhone e demais)
function camPossivel(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);}
let _zx=null;
function carregarZX(){return _zx||(_zx=new Promise((ok,er)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
  s.onload=()=>window.ZXing?ok(window.ZXing):er(new Error('x'));s.onerror=()=>{_zx=null;er(new Error('x'));};document.head.appendChild(s);}));}
function scanMsg(t,h){const m=$('sc_msg');if(!m)return;m.className='scanmsg '+t;m.textContent=h;clearTimeout(scanMsg.t);m.classList.add('pisca');scanMsg.t=setTimeout(()=>m.classList.remove('pisca'),350);}
async function abrirCamera(onCode,unica){
  const box=$('sc_cambox'),v=$('sc_vid'),cb=$('sc_cam');if(!box)return;
  if(window._cam){pararCam();return;}
  if(!camPossivel()){scanMsg('err',window.isSecureContext?'Este navegador não libera a câmera. Use o Chrome (Android) ou o Safari (iPhone).':'A câmera só funciona no endereço seguro (https://). Recarregue a página.');return;}
  let ult='',ultT=0;const achou=c=>{c=String(c||'').trim();if(!c)return;const t=Date.now();if(c===ult&&t-ultT<1500)return;ult=c;ultT=t;if(navigator.vibrate)navigator.vibrate(60);if(unica)pararCam();onCode(c);};
  window._cam={parar:()=>{}};box.classList.remove('hidden');if(cb)cb.textContent='Fechar câmera';scanMsg('','Aponte a câmera para o código de barras…');
  const vid={video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}};
  try{let nativo=false;
    if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();nativo=f.includes('ean_13');}catch(e){}}
    if(nativo){const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code','data_matrix']});
      const st=await navigator.mediaDevices.getUserMedia(vid);if(!window._cam){st.getTracks().forEach(t=>t.stop());return;}
      v.srcObject=st;await v.play();window._cam={parar:()=>st.getTracks().forEach(t=>t.stop())};
      const loop=async()=>{if(!window._cam)return;try{const c=await det.detect(v);if(c[0])achou(c[0].rawValue);}catch(e){}if(window._cam)setTimeout(loop,180);};loop();}
    else{const Z=await carregarZX();if(!window._cam)return;const B=Z.BarcodeFormat,h=new Map();
      h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[B.EAN_13,B.EAN_8,B.UPC_A,B.UPC_E,B.CODE_128,B.CODE_39,B.ITF,B.QR_CODE,B.DATA_MATRIX]);h.set(Z.DecodeHintType.TRY_HARDER,true);
      const r=new Z.BrowserMultiFormatReader(h,250);window._cam={parar:()=>{try{r.reset();}catch(e){}}};
      await r.decodeFromConstraints(vid,v,res=>{if(res&&window._cam)achou(res.getText());});}
  }catch(e){pararCam();bip(false);
    scanMsg('err',e&&e.name==='NotAllowedError'?'A câmera foi bloqueada. Libere o acesso à câmera para este site nas configurações do navegador e tente de novo.':e&&e.name==='NotFoundError'?'Nenhuma câmera encontrada neste aparelho.':'Não foi possível abrir a câmera. Use o leitor ou digite o código.');}
}
function scanHtml(rot){const cam=camPossivel()||(!window.isSecureContext&&/^http:/.test(location.href));
  return `<div class="scan"><div class="scanlin"><input id="sc_in" placeholder="${rot||'Bipe o código de barras aqui (ou digite e tecle Enter)'}" autocomplete="off" enterkeyhint="done">${cam?'<button class="small" id="sc_cam" type="button">📷 Câmera</button>':''}</div>
  <div id="sc_msg" class="scanmsg">Leitor pronto · UPC, EAN ou SKU · código da caixa soma as unidades da caixa.</div><div id="sc_cambox" class="hidden"><video id="sc_vid" playsinline muted></video></div></div>`;}
// o: {nome:'compra', itens:[{k,pid,esp}], atual:k=>n, somar:(k,n,origem)=>{}, livre:bool (permite passar do esperado)}
function ligarScan(o){
  const inp=$('sc_in');if(!inp)return;let ts=[];
  const msg=scanMsg;
  const proc=(cod,origem)=>{cod=String(cod||'').trim();if(!cod)return;const r=acharCodigo(cod);
    if(!r){bip(false);msg('err',`✗ Código ${cod} não está cadastrado em nenhum produto. Cadastre o código no produto ou lance a quantidade à mão.`);return;}
    const cands=o.itens.filter(i=>i.pid===r.p.id);
    if(!cands.length){if(o.novo){o.novo(r.p,r.mult);bip(true);msg('ok',`✓ ${r.p.nome} adicionado${r.caixa?' (CAIXA com '+r.mult+' un.)':''}`);return;}
      bip(false);msg('err',`✗ ${r.p.nome} NÃO faz parte desta ${o.nome}. Separe o produto.`);return;}
    const it=cands.find(i=>o.atual(i.k)+r.mult<=i.esp)||cands[0];const at=o.atual(it.k);
    if(at+r.mult>it.esp&&!o.livre){bip(false);msg('err',`✗ ${r.p.nome}: passaria das ${un(it.esp)} un. esperadas (já conferidas ${un(at)}). Leitura NÃO somada.`);return;}
    o.somar(it.k,r.mult,origem);bip(at+r.mult<=it.esp);
    msg(at+r.mult>it.esp?'err':'ok',`${at+r.mult>it.esp?'⚠ ACIMA DO ESPERADO · ':'✓ '}${r.p.nome}${r.p.variacao?' ('+r.p.variacao+')':''} +${r.mult}${r.caixa?' · CAIXA com '+r.mult+' un.':' · unidade'} → ${un(at+r.mult)} de ${un(it.esp)}${origem==='manual'?' · digitado à mão':''}`);};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const rap=ts.length>=4&&(ts[ts.length-1]-ts[0])/(ts.length-1)<45;const v=inp.value;ts=[];inp.value='';proc(v,rap?'scanner':'manual');return;}
    if(e.key.length===1)ts.push(performance.now());});
  if(!(window.matchMedia&&matchMedia('(pointer:coarse)').matches))setTimeout(()=>inp.focus(),60);
  const cb=$('sc_cam');if(cb)cb.onclick=()=>abrirCamera(c=>proc(c,'camera'));
}
function pararCam(){if(window._cam){const c=window._cam;window._cam=null;try{c.parar();}catch(e){}}const vv=$('sc_vid');if(vv&&vv.srcObject){try{vv.srcObject.getTracks().forEach(t=>t.stop());}catch(e){}vv.srcObject=null;}const b=$('sc_cambox');if(b)b.classList.add('hidden');const c=$('sc_cam');if(c)c.textContent='📷 Câmera';}

function barraBusca(ph,botoes=''){return `<div class="barra"><input id="busca" type="search" placeholder="${ph}" value="${esc(busca)}">${botoes}</div>`;}

</div>

    ${ETAPAS.map(([k])=>kpi(un(pe[k]||0),ETAPA_CURTA[k],'remessas')).join('')}
    ${pe.direta?kpi(un(pe.direta),'Rota direta (DHL / etiquetas)','remessas'):''}${ti.a?kpi(un(ti.a)+' un. · '+alf.length+' remessa(s)','Na alfândega','remessas'):''}

   <b>Integrações pendentes:</b> atualização automática do status da remessa pela API da DHL (precisa da chave de API da DHL) · confirmação automática do recebimento no Full pela API do Mercado Livre/Amazon (precisa de um aplicativo cadastrado no Mercado Livre).<br>
   <b>Dados demonstrativos:</b> nenhum — tudo o que aparece aqui foi lançado no sistema.</div>`;
}

// preenche EAN/UPC/SKU do cadastro a partir do leitor ou da câmera
function ligarScanCodigos(pref,pid){
  const preencher=v=>{v=String(v||'').trim().replace(/\s/g,'');if(!v)return;const r=acharCodigo(v);
    if(r&&r.p.id!==pid){bip(false);scanMsg('err','✗ O código '+v+' já pertence a '+r.p.nome+'.');return;}
    const c=/^\d{12}$/.test(v)?'u':(/^\d{13}$/.test(v)||/^\d{8}$/.test(v)||/^\d{14}$/.test(v))?'e':'s';
    const el=$(pref+'_'+c);if(!el)return;el.value=v;el.classList.add('lido');setTimeout(()=>el.classList.remove('lido'),1200);
    bip(true);scanMsg('ok','✓ Código '+v+' preenchido no campo '+{u:'UPC',e:'EAN',s:'SKU'}[c]+'.');};
  const inp=$('sc_in');if(!inp)return;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=inp.value;inp.value='';preencher(v);}});
  scanMsg('','Leitor pronto · bipe o produto ou use a câmera do celular.');
  const cb=$('sc_cam');if(cb)cb.onclick=()=>abrirCamera(preencher,true);}

      itens:its.map(x=>({produto_id:x.p?x.p.id:null,nome:x.p?null:x.prod.trim(),sku:x.sku,ean:x.ean,variacao:x.variacao,embalagem:x.embalagem,un_por_emb:x.embalagem==='caixa'?x.un_por_emb||1:1,qtd:x.qtd,valor_unit:x.valor_unit,desconto:x.desconto}))};

  ligarScan({nome:'remessa',itens:it.map(i=>({k:i.id,pid:i.produto_id,esp:i.pend})),atual:k=>num(g('ok',k).value)+num(g('av',k).value)+num(g('inc',k).value),
    somar:(k,n,o)=>{const e=g('ok',k);e.value=num(e.value)+n;if(o!=='manual')lidos[k]=(lidos[k]||0)+n;calc();}});

      manual:Math.max(num(g('ok',i.id).value)+num(g('av',i.id).value)+num(g('inc',i.id).value)-(lidos[i.id]||0),0)})).filter(x=>x.ok+x.avaria+x.incorreta>0);

    if(enviado)return;gravarPref('iron_wh',$('ch_w').value);
    rodar($('ok'),async()=>{enviado=true;pararCam();
      try{const x=await rpc('receber_remessa',{p:{envio_id:rid,chave,warehouse_id:+$('ch_w').value,data:val('ch_d'),responsavel:val('ch_r'),obs:val('ch_o'),itens}});

        await carregar();toast(x.repetido?'Conferência já registrada — nada duplicado.':'Conferência registrada.'+ax);modalDetalhe(rid);}catch(e){enviado=false;throw e;}});};
}

function totUSDRem(r,qtdFn){return itensEnv(r).reduce((s,i)=>s+qtdFn(i)*(i.custo&&+i.custo.custo_usd_saida||0),0);}
function blocoCustos(r){
  const c=um(r.envios_custo)||{},it=itensEnv(r),br=v=>String(+v).replace('.',',');
  const etp=custoEtapasBRL(r);
  const vp=+c.valor_pago_brl>0?c.valor_pago_brl:(c.custos_lancados&&+c.cotacao>0?'':'');
  return `<h3>Fechamento em reais</h3>
  <div class="tres"><div class="campo"><label>Valor pago em R$ pela mercadoria</label><input id="k_vp" inputmode="decimal" placeholder="0,00" value="${vp?br(vp):''}"><div class="meta">O que saiu de fato da conta: câmbio com IOF, spread e taxas, PIX/TED ou acerto.</div></div>
  <div class="campo"><label>Fretes em R$</label><input id="k_fr" inputmode="decimal" placeholder="0,00" value="${+c.frete?br(c.frete):etp>0?br(etp):''}">${etp>0?'<div class="meta">Fretes da rota (Aladin + freteiro + SP): '+brl(etp)+'</div>':''}</div>
  <div class="campo"><label>Impostos e taxas em R$</label><input id="k_im" inputmode="decimal" placeholder="0,00" value="${+c.imposto?br(c.imposto):''}"></div></div>
  <div class="total" id="k_efet"></div>
  <div class="scroll"><table class="planilha rateio"><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Custo un. US$</th><th class="n">Mercadoria R$</th><th class="n">+ Frete</th><th class="n">+ Imposto</th><th class="n">Custo final un.</th><th class="n">Total</th></tr>
  ${it.map(i=>`<tr><td>${esc(produto(i.produto_id).nome)}</td><td class="n" data-kq="${i.id}"></td><td class="n"><input data-ku="${i.id}" inputmode="decimal" placeholder="0,00" value="${i.custo&&+i.custo.custo_usd_saida?br(i.custo.custo_usd_saida):''}"></td>
    <td class="n" data-kb="${i.id}"></td><td class="n" data-kf="${i.id}"></td><td class="n" data-ki="${i.id}"></td><td class="n" data-kc="${i.id}"></td><td class="n" data-kt="${i.id}"></td></tr>`).join('')}
  <tr class="tot"><td>Total</td><td class="n" id="k_tq"></td><td class="n" id="k_tu"></td><td class="n" id="k_tb"></td><td class="n" id="k_tf"></td><td class="n" id="k_ti"></td><td></td><td class="n" id="k_tt"></td></tr></table></div>
  <div class="meta">O custo em US$ vem das compras (notas). O valor pago em R$ é dividido pelo valor em dólar de cada produto, o frete por unidade e o imposto pelo valor de cada produto.</div>
  <h3>Comprovantes do pagamento em R$</h3>${anexosHtml('fechamento',r.id,true)}${campoArquivos('k_arq','Contrato de câmbio, comprovante PIX/TED, recibos')}`;
}
function ligarCustos(r,qtdFn){
  const it=itensEnv(r),M=$('modal'),q_=s=>M.querySelector(s);
  const calc=()=>{if(!$('k_vp'))return null;const vp=dinheiro(val('k_vp')),fr=dinheiro(val('k_fr'))||0,im=dinheiro(val('k_im'))||0;
    const L=it.map(i=>{const u=dinheiro(q_(`[data-ku="${i.id}"]`).value);return {id:i.id,q:qtdFn(i),u};});
    const tq=L.reduce((s,x)=>s+x.q,0),tu=L.reduce((s,x)=>s+(isNaN(x.u)?0:x.q*x.u),0);
    const k=vp>0&&tu>0?vp/tu:NaN;L.forEach(x=>x.b=isNaN(x.u)||isNaN(k)?NaN:x.u*k);
    const tv=L.reduce((s,x)=>s+(isNaN(x.b)?0:x.q*x.b),0),fu=tq?fr/tq:0;let tb=0,tf=0,ti=0,tt=0;
    L.forEach(x=>{const iu=isNaN(x.b)?NaN:(tv>0?im*x.b/tv:(tq?im/tq:0)),fin=x.b+fu+iu;
      q_(`[data-kq="${x.id}"]`).textContent=un(x.q);q_(`[data-kb="${x.id}"]`).textContent=isNaN(x.b)?'—':brl(x.b);
      q_(`[data-kf="${x.id}"]`).textContent=brl(fu);q_(`[data-ki="${x.id}"]`).textContent=isNaN(iu)?'—':brl(iu);
      q_(`[data-kc="${x.id}"]`).innerHTML=isNaN(fin)?'—':'<b>'+brl(fin)+'</b>';q_(`[data-kt="${x.id}"]`).textContent=isNaN(fin)?'—':brl(fin*x.q);
      if(!isNaN(fin)){tb+=x.b*x.q;tf+=fu*x.q;ti+=iu*x.q;tt+=fin*x.q;}});
    $('k_tq').textContent=un(tq);$('k_tu').textContent=usd(tu);$('k_tb').textContent=brl(tb);$('k_tf').textContent=brl(tf);$('k_ti').textContent=brl(ti);$('k_tt').innerHTML='<b>'+brl(tt)+'</b>';
    $('k_efet').innerHTML=isNaN(k)?'Informe o valor pago em R$ para o sistema calcular o <b>dólar efetivo</b> deste envio.':`Mercadoria ${usd(tu)} · pago ${brl(vp)} → <b>dólar efetivo R$ ${k.toLocaleString('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:4})}</b> (já com IOF e taxas) · custo total do envio <b>${brl(tt)}</b>`;
    return {k,vp,fr,im,L,tu};};
  $('kwrap').addEventListener('input',calc);calc();
  return opcional=>{const {k,vp,fr,im,L,tu}=calc();
    if(opcional&&!(vp>0)&&!val('k_fr')&&!val('k_im'))return null;
    if(L.some(x=>isNaN(x.u)))throw new Error('Informe o custo unitário (US$) de todos os produtos.');
    if(!(vp>0))throw new Error('Informe o valor pago em R$ pela mercadoria.');
    if(!(tu>0))throw new Error('O total em US$ da mercadoria está zerado.');
    if(isNaN(dinheiro(val('k_fr')||'0'))||isNaN(dinheiro(val('k_im')||'0')))throw new Error('Valor de frete ou imposto inválido.');
    return {vp,a:{p_envio:r.id,p_cotacao:+k.toFixed(6),p_frete:fr,p_imposto:im,p_itens:L.map(x=>({item_id:x.id,custo_usd:x.u}))}};};
}
function modalCustos(rid){

let fgMes=null,fgCat='',fgSit='';
function custosModulos(mes){const out=[];const cot=+(String(cotDolar()).replace(',','.'))||5;
  D.envios.filter(r=>r.status!=='cancelado'&&String(r.data_saida).slice(0,7)===mes).forEach(r=>{const c=um(r.envios_custo);if(c&&+c.valor_pago_brl>0)out.push({o:'Remessa #'+r.id+' · mercadoria (fechamento em R$)',cat:'Mercadorias',v:+c.valor_pago_brl,ref:['env',r.id]});});
  D.envios.filter(r=>r.status!=='cancelado'&&String(r.data_saida).slice(0,7)===mes).forEach(r=>{const k=r.moeda_despesas==='BRL'?1:(+um(r.envios_custo||[])?.cotacao||cot);const v=(+r.frete_transp+ +r.seguro+ +r.despesas)*k;if(v>0)out.push({o:'Remessa #'+r.id+' · frete/seguro/despesas',cat:'Frete internacional',v,ref:['env',r.id]});
    (r.alfandega_eventos||[]).forEach(a=>{const x=(+a.imposto+ +a.taxas)*(a.moeda==='BRL'?1:cot);if(x>0&&String(a.data).slice(0,7)===mes)out.push({o:'Remessa #'+r.id+' · alfândega',cat:'Impostos e taxas',v:x,ref:['env',r.id]});});});
  D.full.filter(f=>f.status!=='cancelado'&&+f.custo>0&&String(f.data_saida||f.criado_em).slice(0,7)===mes).forEach(f=>out.push({o:'Full #'+f.id,cat:'Transporte e entregas',v:+f.custo,ref:['full',f.id]}));
  return out;}

}
function modalLanc(id){const l=id?D.lancamentos.find(x=>x.id===id):null;const so=l&&(l.situacao==='cancelado'||!tem('editar_financeiro')||!ehAdmin());reabrir=l?()=>modalLanc(id):null;
  const v=(k,d='')=>l&&l[k]!=null?esc(l[k]):d;
  abrir(`<h2>${l?'Lançamento #'+l.id:'Novo lançamento'}</h2><div class="sub">${l&&l.situacao==='cancelado'?'Cancelado: '+esc(l.cancel_motivo||''):'O sistema avisa se já existe um lançamento igual ou se o custo já foi registrado na compra, remessa ou Full.'}</div>
  <div class="tres"><div class="campo"><label>Categoria</label><select id="lc_c">${CATS.map(c=>`<option ${l&&l.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
   <div class="campo"><label>Classificação</label><select id="lc_cl"><option value="operacional">Despesa operacional</option><option value="mercadoria" ${l&&l.classe==='mercadoria'?'selected':''}>Custo atribuído às mercadorias</option></select></div>
   <div class="campo"><label>Situação</label><select id="lc_s"><option value="pago">Pago</option><option value="pendente" ${l&&l.situacao==='pendente'?'selected':''}>A pagar</option></select></div></div>
  <div class="campo"><label>Descrição</label><input id="lc_d" value="${v('descricao')}"></div>
  <div class="tres"><div class="campo"><label>Valor</label><input id="lc_v" inputmode="decimal" value="${l?numBR(l.valor):''}"></div><div class="campo"><label>Moeda</label><select id="lc_m">${['BRL','USD','EUR','PYG'].map(m=>`<option ${l&&l.moeda===m?'selected':''}>${m}</option>`).join('')}</select></div>
   <div class="campo" id="c_lck"><label>Cotação em R$ · data</label><div class="duas"><input id="lc_k" inputmode="decimal" value="${l&&l.moeda!=='BRL'?numBR(l.cotacao_brl):esc(cotDolar())}"><input id="lc_dk" type="date" value="${v('data_cotacao',hoje())}"></div></div></div>
  <div class="tres"><div class="campo"><label>Data</label><input id="lc_dt" type="date" value="${v('data',hoje())}"></div><div class="campo"><label>Vencimento</label><input id="lc_vc" type="date" value="${v('vencimento')}"></div>
   <div class="campo"><label>Quem pagou</label><input id="lc_pp" list="dl_part" value="${v('pago_por')}"><datalist id="dl_part">${D.participantes.map(p=>`<option value="${esc(p.nome)}">`).join('')}</datalist></div></div>
  <div class="tres"><div class="campo"><label>Conta de origem</label><input id="lc_co" list="dl_conta" value="${v('conta')}"><datalist id="dl_conta">${D.contas.map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist></div>
   <div class="campo"><label>Vincular a</label><select id="lc_vt"><option value="">Nada (geral)</option>${[['compra','Compra'],['remessa','Remessa DHL/Aladin'],['full','Envio Full'],['unidade','Unidade / warehouse'],['operacao','Operação']].map(([k,t])=>`<option value="${k}" ${l&&l.vinculo_tipo===k?'selected':''}>${t}</option>`).join('')}</select></div>
   <div class="campo" id="c_lcvi"><label>Qual?</label><select id="lc_vi"></select><input id="lc_vx" class="hidden" value="${v('vinculo_texto')}"></div></div>
  <div class="campo hidden" id="c_rat"><label>Rateio nas mercadorias</label><select id="lc_rt"><option value="">Sem rateio</option><option value="unidades">Por unidade</option><option value="valor">Pelo valor de cada produto</option></select><div id="lc_rp" class="meta"></div></div>
  <div class="campo"><label>Observação</label><input id="lc_o" value="${v('obs')}"></div>
  ${l?'<h3>Comprovantes</h3>'+anexosHtml('lancamento',l.id,!so):campoArquivos('lc_arq','Comprovante')}
  <div class="erro"></div><div class="rodape">${l&&!so?'<button class="danger" id="lc_x">Cancelar lançamento</button>':''}<button id="cx">Fechar</button>${so?'':'<button class="primary" id="ok">Salvar</button>'}</div>`);
  const M=$('modal');
  const opts=t=>t==='compra'?D.pedidos.map(p=>[p.id,'#'+p.id+' · '+p.fornecedor+' · '+fd(p.data)]):t==='remessa'?D.envios.map(r=>[r.id,'#'+r.id+' · '+r.transportadora+' · '+fd(r.data_saida)]):t==='full'?D.full.map(f=>[f.id,'#'+f.id+' · '+f.marketplace+(f.conta?' · '+f.conta:'')]):[];
  const rateio=()=>{const t=$('lc_vt').value,vid=+$('lc_vi').value,cr=$('lc_rt').value,vv=dinheiro(val('lc_v'))*($('lc_m').value==='BRL'?1:dinheiro(val('lc_k')));
    if(!cr||!vid||isNaN(vv))return null;let base=[];
    if(t==='compra'){const p=pedido(vid);base=(p.pedido_itens||[]).map(i=>({pid:i.produto_id,q:i.qtd,v:i.qtd*i.valor_unit*p.cotacao_brl}));}
    if(t==='remessa'){const r=remessa(vid);base=itensEnv(r).map(i=>({pid:i.produto_id,q:i.qtd_enviada,v:i.qtd_enviada*(i.custo?+i.custo.custo_medio_saida:0)}));}
    if(t==='full'){const f=envFull(vid);base=(f.envio_full_itens||[]).map(i=>{const p=D.produtos.find(x=>x.id===i.produto_id);return {pid:i.produto_id,q:i.qtd,v:i.qtd*custoP(p||{}).custo_medio};});}
    const tq=base.reduce((s,x)=>s+x.q,0),tv=base.reduce((s,x)=>s+x.v,0);
    const comp=base.map(x=>{const parte=cr==='valor'&&tv>0?x.v/tv:tq?x.q/tq:0;return {produto_id:x.pid,produto:nomeP(x.pid),qtd:x.q,parte:+parte.toFixed(6),valor:+(vv*parte).toFixed(2),por_unidade:x.q?+(vv*parte/x.q).toFixed(4):0};});
    return {criterio:cr==='valor'?'Pelo valor de cada produto':'Por unidade',total_brl:+vv.toFixed(2),composicao:comp};};
  const atual=()=>{const m=$('lc_m').value,t=$('lc_vt').value;$('c_lck').classList.toggle('hidden',m==='BRL');
    const o=opts(t);$('lc_vi').classList.toggle('hidden',!o.length);$('lc_vx').classList.toggle('hidden',!['unidade','operacao'].includes(t));$('c_lcvi').classList.toggle('hidden',!t);
    if(o.length&&$('lc_vi').dataset.t!==t){$('lc_vi').innerHTML=o.map(([k,x])=>`<option value="${k}" ${l&&l.vinculo_id===k?'selected':''}>${esc(x)}</option>`).join('');$('lc_vi').dataset.t=t;}
    $('c_rat').classList.toggle('hidden',!($('lc_cl').value==='mercadoria'&&o.length));
    const r=rateio();$('lc_rp').innerHTML=r?`Critério: <b>${r.criterio}</b><br>${r.composicao.map(c=>esc(c.produto)+': '+brl(c.valor)+' ('+(c.parte*100).toFixed(1).replace('.',',')+'% · '+brl(c.por_unidade,4)+'/un.)').join('<br>')}`:(l&&l.rateio?'Rateio salvo: '+esc(l.rateio.criterio):'');};
  if(l&&l.rateio&&l.rateio.criterio)$('lc_rt').value=/valor/.test(l.rateio.criterio)?'valor':'unidades';
  M.addEventListener('change',atual);M.addEventListener('input',e=>{if(['lc_v','lc_k'].includes(e.target.id))atual();});atual();
  if(so)M.querySelectorAll('input:not([type=file]),select').forEach(e=>e.disabled=true);
  $('cx').onclick=fechar;
  if($('lc_x'))$('lc_x').onclick=()=>pedirMotivo('Cancelar o lançamento #'+id+'?','O lançamento continua no histórico como cancelado.','Cancelar',async m=>{await rpc('cancelar_lancamento',{p_id:id,p_motivo:m});toast('Lançamento cancelado.');},()=>{fechar();render();});
  const chave=uuid();
  if($('ok'))$('ok').onclick=()=>{const t=$('lc_vt').value,o=opts(t);
    const p={id:l?l.id:null,chave,categoria:$('lc_c').value,classe:$('lc_cl').value,descricao:val('lc_d'),valor:dinheiro(val('lc_v')),moeda:$('lc_m').value,cotacao_brl:dinheiro(val('lc_k')),data_cotacao:val('lc_dk'),
      data:val('lc_dt'),vencimento:val('lc_vc'),situacao:$('lc_s').value,pago_por:val('lc_pp'),conta:val('lc_co'),vinculo_tipo:t||null,vinculo_id:o.length?+$('lc_vi').value:null,vinculo_texto:['unidade','operacao'].includes(t)?val('lc_vx'):null,rateio:rateio(),obs:val('lc_o')};
    const ir=forcar=>rodar($('ok'),async()=>{let nid;try{nid=await rpc('salvar_lancamento',{p,p_forcar:forcar});}
      catch(e){if(/DUPLICADO/.test(e.message||'')){const er=M.querySelector('.erro');er.innerHTML=esc(e.message.replace('DUPLICADO: ',''))+' <button class="small" id="lc_f" type="button">Lançar mesmo assim</button>';$('ok').disabled=false;$('lc_f').onclick=()=>ir(true);return;}throw e;}
      const ax=l?'':await anexarDepois('lancamento',nid,'lc_arq');await carregar();toast('Lançamento salvo.'+ax);fechar();});
    ir(false);};
}

// ---------- APORTES DOS PARTICIPANTES ----------
let fapPart='';
function totaisParticipantes(){return D.participantes.map(p=>{const m=D.movimentos.filter(x=>x.participante_id===p.id&&!x.cancelado);const by=t=>{const o={};m.filter(x=>x.tipo===t).forEach(x=>o[x.moeda]=(o[x.moeda]||0)+ +x.valor);return o;};
  return {id:p.id,nome:p.nome,ap:by('aporte'),em:by('emprestimo'),dp:by('despesa_paga'),re:by('reembolso'),rt:by('retirada'),brl:t=>m.filter(x=>x.tipo===t).reduce((s,x)=>s+ +x.valor_brl,0)};}).filter(x=>D.movimentos.some(m=>m.participante_id===x.id));}
function abaAportes(){
  const T=totaisParticipantes(),fmt=o=>Object.entries(o).map(([m,v])=>moeda(v,m)).join(' + ')||'—';
  const L=D.movimentos.filter(m=>!fapPart||m.participante_id===+fapPart).filter(m=>bate(TIPOS_MOV[m.tipo],m.finalidade,m.conta_origem,m.conta_destino,(D.participantes.find(p=>p.id===m.participante_id)||{}).nome));
  return barraBusca('Buscar…',tem('editar_aportes')?'<button class="primary" data-act="mov">+ Movimentação</button>':'')+
  `<div class="total">Cada tipo é somado separado: <b>aporte de capital</b>, <b>empréstimo do participante</b>, <b>despesa paga em nome da empresa</b>, <b>reembolso</b> e <b>retirada</b>. O sistema não presume aportes iguais, não altera a participação societária e não cria saldo "a devolver" para aporte de capital.</div>
  ${T.length?`<div class="scroll"><table class="planilha"><tr><th>Participante</th><th>Aportes de capital</th><th>Empréstimos</th><th>Despesas pagas p/ empresa</th><th>Reembolsos recebidos</th><th>Retiradas</th></tr>
   ${T.map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td>${fmt(x.ap)}<div class="meta">${brl(x.brl('aporte'))}</div></td><td>${fmt(x.em)}<div class="meta">${brl(x.brl('emprestimo'))}</div></td><td>${fmt(x.dp)}<div class="meta">${brl(x.brl('despesa_paga'))}</div></td><td>${fmt(x.re)}<div class="meta">${brl(x.brl('reembolso'))}</div></td><td>${fmt(x.rt)}<div class="meta">${brl(x.brl('retirada'))}</div></td></tr>`).join('')}
   <tr class="tot"><td>Consolidado (R$)</td>${['aporte','emprestimo','despesa_paga','reembolso','retirada'].map(t=>`<td><b>${brl(T.reduce((s,x)=>s+x.brl(t),0))}</b></td>`).join('')}</tr></table></div>
   <div class="meta">Valores em R$ convertidos pela taxa de câmbio registrada em cada movimentação.</div>`:'<div class="vazio">Nenhuma movimentação lançada.</div>'}
  <div class="barra" style="margin-top:14px"><select id="fap_p" style="max-width:260px"><option value="">Todos os participantes</option>${D.participantes.map(p=>`<option value="${p.id}" ${String(p.id)===fapPart?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>
  ${L.length?`<div class="scroll"><table class="planilha"><tr><th>Data</th><th>Participante</th><th>Tipo</th><th>Finalidade</th><th>Contas</th><th class="n">Valor</th><th class="n">Câmbio</th><th class="n">R$</th></tr>
   ${L.map(m=>`<tr class="${m.cancelado?'pago':''} clk" data-mov="${m.id}"><td>${fd(m.data)}</td><td>${esc((D.participantes.find(p=>p.id===m.participante_id)||{}).nome||'')}</td><td>${TIPOS_MOV[m.tipo]}${m.cancelado?' (cancelado)':''}</td><td>${esc(m.finalidade||'')}${anexosDe('aporte',m.id).length?' 📎':''}</td><td>${esc(m.conta_origem||'—')} → ${esc(m.conta_destino||'—')}</td><td class="n">${moeda(m.valor,m.moeda)}</td><td class="n">${m.moeda==='BRL'?'—':numBR(m.cotacao_brl)+' em '+fd(m.data_cotacao)}</td><td class="n">${brl(m.valor_brl)}</td></tr>`).join('')}</table></div>`:''}`;
}
function modalMov(id){const m=id?D.movimentos.find(x=>x.id===id):null;reabrir=m?()=>modalMov(id):null;

  <div class="tres"><div class="campo"><label>Data</label><input id="mv_d" type="date" value="${hoje()}"></div><div class="campo"><label>Valor</label><input id="mv_v" inputmode="decimal"></div><div class="campo"><label>Moeda</label><select id="mv_m">${['BRL','USD','EUR','PYG'].map(x=>`<option>${x}</option>`).join('')}</select></div></div>

  <div class="duas"><div class="campo"><label>Conta de origem</label><input id="mv_co" list="dl_conta"></div><div class="campo"><label>Conta de destino</label><input id="mv_cd" list="dl_conta"><datalist id="dl_conta">${D.contas.map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist></div></div>
  <div class="campo"><label>Finalidade</label><input id="mv_f" placeholder="ex.: compra de estoque nov/2026"></div><div class="campo"><label>Observações</label><input id="mv_o"></div>

  <div class="lista">${D.perfis.map(p=>{const base=PERM_PAPEL[p.papel]||[];return `<div class="card" style="flex-wrap:wrap"><div><div class="t">${esc(p.nome||'')}</div><div class="meta">${esc(p.email||'')}</div>${p.papel?'':'<div class="warn">Aguardando liberação</div>'}</div>
    <div><select data-papel="${p.user_id}" style="min-width:170px"><option value="">Sem acesso</option>${Object.entries(PAPEIS).map(([k,l])=>`<option value="${k}" ${p.papel===k?'selected':''}>${l}</option>`).join('')}</select></div>
    ${p.papel&&p.papel!=='admin'?`<div class="perms" style="width:100%">${Object.entries(PERMS).map(([k,l])=>`<label class="${base.includes(k)?'fixo':''}"><input type="checkbox" data-perm="${p.user_id}" value="${k}" ${base.includes(k)||(p.perms||[]).includes(k)?'checked':''} ${base.includes(k)?'disabled':''}> ${l}</label>`).join('')}</div>`:''}</div>`;}).join('')}</div>
  <div class="meta" style="margin-top:10px"><b>Administrador (Iago):</b> vê e faz tudo, inclusive editar, cancelar, usuários e acessos. <b>Sócio (Edson, Eduardo):</b> vê todos os valores (custos, fretes, gastos, aportes) e lança novos registros, mas não edita, cancela nem exclui o que já foi lançado. <b>EUA (Iron):</b> lança compras, remessas e etapas com os valores, mas não vê nenhum valor depois de salvo. <b>Brasil:</b> etapas, conferência no warehouse e Full — sem valores. Ver custos, gastos e aportes não pode ser liberado para EUA nem Brasil.</div>`;

function abaCadastros(){
  const sec=(t,tipo,lst,f)=>`<h3>${t} <button class="small" data-cad="${tipo}">+ Adicionar</button></h3><div class="lista">${lst.map(x=>`<div class="card click" data-cad="${tipo}" data-cadid="${x.id}"><div><div class="t">${esc(x.nome)}${x.ativo===false?' <span class="badge b-can">Inativo</span>':''}</div><div class="meta">${f(x)}</div></div></div>`).join('')||'<div class="vazio">Nenhum cadastro.</div>'}</div>`;
  return sec('Warehouses / unidades','warehouse',D.warehouses,w=>esc(w.unidade||''))+sec('Contas (origem e destino de dinheiro)','conta',D.contas,c=>[c.tipo,c.moeda,c.titular].filter(Boolean).map(esc).join(' · '))+
   sec('Participantes (sócios / investidores)','participante',D.participantes,p=>p.user_id?'Usuário: '+esc(nomeDe(p.user_id)):'Sem usuário vinculado');
}
function modalCad(tipo,id){const L={warehouse:D.warehouses,conta:D.contas,participante:D.participantes}[tipo];const x=id?L.find(z=>z.id===id):{};
  abrir(`<h2>${id?'Editar':'Novo'} ${{warehouse:'warehouse',conta:'conta',participante:'participante'}[tipo]}</h2>
  <div class="campo"><label>Nome</label><input id="cd_nome" value="${esc(x.nome||'')}"></div>
  ${tipo==='warehouse'?`<div class="campo"><label>Unidade / cidade</label><input id="cd_un" value="${esc(x.unidade||'')}"></div>`:''}
  ${tipo==='conta'?`<div class="tres"><div class="campo"><label>Tipo</label><input id="cd_tp" value="${esc(x.tipo||'')}" placeholder="Banco, cartão, caixa…"></div><div class="campo"><label>Moeda</label><select id="cd_md">${['BRL','USD','EUR','PYG'].map(m=>`<option ${x.moeda===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="campo"><label>Titular</label><input id="cd_tt" value="${esc(x.titular||'')}"></div></div>`:''}
  ${tipo==='participante'?`<div class="campo"><label>Usuário do sistema (opcional)</label><select id="cd_us"><option value="">—</option>${D.perfis.map(p=>`<option value="${p.user_id}" ${x.user_id===p.user_id?'selected':''}>${esc(p.nome||p.email)}</option>`).join('')}</select></div>`:''}
  ${id?`<label class="meta" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cd_at" style="width:auto" ${x.ativo!==false?'checked':''}> Ativo</label>`:''}
  <div class="erro"></div><div class="rodape"><button id="cx">Cancelar</button><button class="primary" id="ok">Salvar</button></div>`);
  $('cx').onclick=fechar;
  $('ok').onclick=()=>rodar($('ok'),async()=>{const p={id:id||null,nome:val('cd_nome'),unidade:val('cd_un'),tipo:val('cd_tp'),moeda:$('cd_md')?$('cd_md').value:null,titular:val('cd_tt'),user_id:$('cd_us')?$('cd_us').value:null,ativo:$('cd_at')?$('cd_at').checked:true};
    await rpc('salvar_cadastro',{p_tipo:tipo,p});await carregar();toast('Cadastro salvo.');fechar();});}

let filtroAc='',verAud=false,AUD=[];
function abaAcessos(){
  const agora=Date.now();const on=D.perfis.filter(p=>p.ultimo_acesso&&agora-new Date(p.ultimo_acesso).getTime()<180000);
  const txt=a=>a.evento==='aba'?'Abriu a aba <b>'+esc(a.detalhe)+'</b>':a.evento==='acao'?'<b>'+esc(a.detalhe)+'</b>':a.evento==='abriu'?'Abriu '+esc(a.detalhe):a.evento==='entrou'?'Entrou no sistema':esc(a.evento+' '+(a.detalhe||''));
  const lst=(D.acessos||[]).filter(a=>!filtroAc||a.user_id===filtroAc);
  const ult=p=>p.ultimo_acesso?fts(p.ultimo_acesso):'nunca';
  const TB={pedidos:'Compra',pedido_itens:'Item de compra',recebimentos:'Recebimento',recebimento_itens:'Item recebido',compras:'Entrada EUA',produtos_custo:'Estoque EUA',envios:'Remessa',envio_itens:'Item de remessa',divergencias:'Ocorrência',chegadas:'Conferência BR',chegada_itens:'Item conferido',entradas_br:'Estoque BR',envios_full:'Envio Full',envio_full_itens:'Item Full',full_recebimentos:'Recebimento Full',lancamentos:'Gasto',movimentos_participantes:'Aporte',alfandega_eventos:'Alfândega',produtos:'Produto',perfis:'Usuário',ajustes_estoque:'Ajuste',anexos:'Anexo',contas:'Conta',participantes:'Participante',warehouses:'Warehouse'};
  return `<div class="chips" style="margin:10px 0"><button class="${verAud?'':'on'}" data-aud="0">Acessos</button><button class="${verAud?'on':''}" data-aud="1">Histórico de alterações</button></div>`+(verAud?
  `${AUD.length?`<div class="scroll"><table class="planilha"><tr><th>Data e hora</th><th>Pessoa</th><th>O quê</th><th>Ação</th><th>Registro</th></tr>${AUD.map(a=>`<tr><td>${new Date(a.em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}</td><td>${esc(nomeDe(a.user_id)||'sistema')}</td><td>${esc(TB[a.tabela]||a.tabela)}</td><td>${{INSERT:'Criou',UPDATE:'Alterou',DELETE:'Removeu'}[a.acao]||a.acao}</td><td>#${esc(a.registro||'')}</td></tr>`).join('')}</table></div>`:'<div class="vazio">Carregando…</div>'}`
  :`<div class="total"><b>Online agora (${on.length}):</b> ${on.length?on.map(p=>'● '+esc(p.nome||p.email)).join(' · '):'ninguém além de você'}</div>
  <div class="lista">${D.perfis.filter(p=>p.papel).map(p=>`<div class="card"><div><div class="t">${esc(p.nome||p.email)}</div><div class="meta">${esc(p.email)} · ${PAPEIS[p.papel]||''}</div></div><div class="meta">Último acesso: <b>${ult(p)}</b></div></div>`).join('')}</div>
  <div class="barra" style="margin-top:14px"><select id="filtroAc"><option value="">Todas as pessoas</option>${D.perfis.map(p=>`<option value="${p.user_id}" ${filtroAc===p.user_id?'selected':''}>${esc(p.nome||p.email)}</option>`).join('')}</select></div>
  ${lst.length?`<div class="scroll"><table class="planilha"><tr><th>Data e hora</th><th>Pessoa</th><th>O que fez</th></tr>${lst.map(a=>`<tr><td>${new Date(a.em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(nomeDe(a.user_id)||'—')}</td><td>${txt(a)}</td></tr>`).join('')}</table></div>`:'<div class="vazio">Nenhum registro ainda.</div>'}`);
}

// ---------- eventos ----------
$('app').addEventListener('click',async e=>{
  const t=e.target.closest('[data-aba],[data-act],[data-fe],[data-env],[data-prod],[data-ped],[data-receber],[data-conferir],[data-full],[data-resdiv],[data-lanc],[data-mov],[data-cad],[data-aud],[data-fped],[data-frec],[data-frem],[data-fwh],[data-ffull],[data-fdiv],[data-feua]');if(!t)return;
  const d=t.dataset;
  if(d.receber){modalReceber(+d.receber);return;}
  if(d.conferir){modalChegada(+d.conferir);return;}
  if(d.resdiv){modalResolverDiv(+d.resdiv,()=>{fechar();render();});return;}
  if(d.prod){modalProduto(+d.prod);return;}
  if(d.ped){modalPedidoDet(+d.ped);return;}
  if(d.env){modalDetalhe(+d.env);return;}
  if(d.full){modalFullDet(+d.full);return;}
  if(d.lanc){modalLanc(+d.lanc);return;}
  if(d.mov){modalMov(+d.mov);return;}
  if(d.cad){modalCad(d.cad,d.cadid?+d.cadid:null);return;}
  if(d.aud!=null){verAud=d.aud==='1';render();if(verAud){const r=await sb.from('auditoria').select('*').order('id',{ascending:false}).limit(400);AUD=r.data||[];render();}return;}
  if(d.aba){aba=d.aba;busca='';log('aba',t.textContent.trim());render();window.scrollTo(0,0);return;}
  const fs={fped:v=>filtroPed=v,frec:v=>filtroRec=v,frem:v=>filtroRem=v,fwh:v=>filtroWh=v,ffull:v=>filtroFull=v,fdiv:v=>filtroDiv=v,feua:v=>filtroEUA=v};
  for(const k in fs)if(d[k]){fs[k](d[k]);render();return;}
  const a=d.act;
  if(a==='sair')sb.auth.signOut();
  if(a==='atualizar'){await carregar();toast('Atualizado.');}
  if(a==='pedido')modalPedido();
  if(a==='remessa')modalRemessa();
  if(a==='full')modalFullNovo();
  if(a==='produto')modalNovoProduto();
  if(a==='lanc')modalLanc();
  if(a==='mov')modalMov();
});
$('app').addEventListener('input',e=>{if(e.target.id==='busca'){busca=e.target.value;render();}});
$('app').addEventListener('change',async e=>{
  if(e.target.id==='filtroAc'){filtroAc=e.target.value;render();return;}
  if(e.target.id==='fg_mes'){fgMes=e.target.value||hoje().slice(0,7);render();return;}
  if(e.target.id==='fg_cat'){fgCat=e.target.value;render();return;}
  if(e.target.id==='fg_sit'){fgSit=e.target.value;render();return;}
  if(e.target.id==='fap_p'){fapPart=e.target.value;render();return;}
  const pm=e.target.closest('[data-perm]');
  if(pm){const u=pm.dataset.perm,ps=[...$('app').querySelectorAll(`[data-perm="${u}"]:checked:not(:disabled)`)].map(x=>x.value);
    try{await rpc('definir_permissoes',{p_user:u,p_perms:ps});toast('Permissões atualizadas.');await carregar();}catch(err){toast(msgErro(err));await carregar();}return;}
  const s=e.target.closest('[data-papel]');if(!s)return;
  try{await rpc('definir_papel',{p_user:s.dataset.papel,p_papel:s.value||null});toast('Acesso atualizado.');await carregar();}
  catch(err){toast(msgErro(err));await carregar();}});
const _fecharOrig=fechar;fechar=function(){pararCam();reabrir=null;_fecharOrig();};

iniciar();

</script>
